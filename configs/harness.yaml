# Settings for the evaluation harness runner (Step 5).
# Values approved by Gaurav on 2026-10-15; they are starting defaults, not tuned values.
db_path: data/results.sqlite          # relative to the repo root; gitignored by *.sqlite
test_set_config: configs/test_set.yaml
max_consecutive_failures: 5           # stop the run as 'aborted' after this many failures in a row
error_max_chars: 500                  # error text stored per failed item is cut to this length
judges_config: configs/judges.yaml    # LLM judge settings and prompts (Step 7)
heldout_config: configs/heldout.yaml  # pre-registration of the one held-out run (Step 12)

# The system under test, as "module:function". The harness imports these by
# name, so evalharness/ never imports rag/ and another RAG system can be
# evaluated by editing this block.
system:
  answer: rag.pipeline:answer                   # the contract: answer(question, config) -> dict
  load_config: rag.pipeline:load_pipeline_config  # reads and checks the --config YAML
  describe: rag.pipeline:describe_system        # optional run metadata; null = none

# Deterministic checks and retrieval metrics (Step 6). Values approved by
# Gaurav on 2026-10-15; starting defaults, not tuned values. scores.version is
# computed from hit_ks + refusal_phrases, so changing either gives a new version.
checks:
  hit_ks: [1, 4]               # hit@k per k; NULL when a run retrieved fewer than k chunks
  report_confidence: 0.95      # Wilson interval level (CLAUDE.md: 95%); not part of the version
  refusal_phrases:             # lowercase substrings of the normalised answer; first match is stored
    - "no mention of"
    - "does not mention"
    - "doesn't mention"
    - "no information"
    - "does not specify"
    - "doesn't specify"
    - "does not provide"
    - "doesn't provide"
    - "not provided in the"
    - "does not contain"
    - "doesn't contain"
    - "cannot find"
    - "can't find"
    - "unable to find"
    - "i don't know"
    - "i do not know"
    - "cannot answer"
    - "can't answer"
    - "unable to answer"

# Baseline / run report (Step 10). Values approved by Gaurav on 2026-10-16.
report:
  primary_metric: ungrounded        # the headline rate (CLAUDE.md); the only supported value
  include_bad_answer_rate: true     # also report ungrounded OR irrelevant
  allow_incomplete: false           # refuse when any judge has failed / missing items

# Experiment comparison (Step 11). Values approved by Gaurav on 2026-10-16.
experiments:
  base_config: configs/v0.yaml        # default for `check --base`
  ignore_keys: [name, experiment]     # top-level config keys that never count as a change
  n_bootstrap: 2000                   # resamples for the paired bootstrap of the faithfulness difference
  bootstrap_seed: 2029                # fixed, so a re-run prints the same interval
  table_path: experiments/experiment_table.md

# Regression comparison and flagging (Step 13). Starting defaults approved by Gaurav on
# 2026-10-16, not tuned values: there are no human "ungrounded" labels to tune against yet.
# flag_version is computed from the first four keys; the gate and labeler are not part of it.
regression:
  relevance_below: 0.75               # low_relevance when the relevance value is below this (rubric 0 or 1 of 0/1/2)
  answer_similarity_below: 0.6        # answer_changed when word similarity to the accepted answer is below this
  similarity_ignore_pattern: '\[\d+\]'   # regex removed before comparing (citation markers like [2])
  disagreement_rules:                 # judges_disagree rules that are on
    - refusal_vs_relevance_a          # answerable, phrase check says refusal, relevance judge says fully relevant
    - refusal_vs_relevance_b          # unanswerable, phrase check says no refusal, relevance judge says fully relevant
  max_ungrounded_rise_points: 3.0     # gate: FAIL when new - accepted ungrounded rate is more than this, in points
  labeler: gaurav                     # accepted_by value; human labels used by `thresholds` come from this labeler

# Automation (Step 14): `python -m evalharness run | score`. Values approved by Gaurav on 2026-10-16.
automation:
  allowed_splits: [dev]               # `run` refuses any other split; held-out has its own Step 12 commands
  retry_failed_judges_in_score: true  # `score` passes --retry-failed to both judges


# Dashboard (Step 15): `streamlit run dashboard/app.py`. Starting defaults for Gaurav to approve.
# The reviewer name for saved reviews is regression.labeler.
dashboard:
  cache_ttl_seconds: 60        # how long a cached DB read is reused; cleared after every saved review
  show_heldout: true           # show the separate, read-only held-out table on the trends page
  excerpt_chars: 400           # display only: answers / chunks longer than this are expandable
  review_labels: [ok, bad]     # the only values the review buttons can write

# README write-up (Step 16): `python -m evalharness.writeup render | update | check`.
# The results block of the README is generated from the stored run_reports between two markers.
writeup:
  readme_path: README.md       # file `update` / `check` read, relative to the repo root
